services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cpa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: cpa_usage_keeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpa -d cpa_usage_keeper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cpa-usage-keeper:
    image: ghcr.io/willxup/cpa-usage-keeper:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cpa:${POSTGRES_PASSWORD:-changeme}@postgres:5432/cpa_usage_keeper?sslmode=disable
      CPA_BASE_URL: ${CPA_BASE_URL}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
      APP_PORT: ${APP_PORT:-8080}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_QUEUE_ADDR: ${REDIS_QUEUE_ADDR:-}
      REDIS_QUEUE_TLS: ${REDIS_QUEUE_TLS:-false}
      REDIS_QUEUE_BATCH_SIZE: ${REDIS_QUEUE_BATCH_SIZE:-1000}
      REDIS_QUEUE_IDLE_INTERVAL: ${REDIS_QUEUE_IDLE_INTERVAL:-1s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      TLS_SKIP_VERIFY: ${TLS_SKIP_VERIFY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  pgdata:
